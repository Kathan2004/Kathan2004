<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat the Firewall - Tic-Tac-Toe</title>
<meta name="description" content="Play tic-tac-toe against an unbeatable firewall. By Kathan Somani.">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
    --x: #58a6ff; --o: #f85149; --win: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --panel: #ffffff; --line: #d0d7de; --text: #1f2328; --muted: #656d76;
            --x: #0969da; --o: #cf222e; --win: #1a7f37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 16px; }
  main { width: min(420px, 100%); text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
  .modes button { background: transparent; color: var(--muted); border: 0; padding: 8px 14px; font: inherit; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 auto 18px; width: 100%; aspect-ratio: 1; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
          display: grid; place-items: center; font-size: clamp(2.5rem, 14vw, 4rem); font-weight: 700; color: var(--text);
          transition: transform .08s ease, border-color .15s ease; }
  .cell:hover:not(:disabled) { border-color: var(--x); }
  .cell:active:not(:disabled) { transform: scale(.96); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); } .cell.o { color: var(--o); }
  .cell.win { border-color: var(--win); box-shadow: 0 0 0 2px var(--win) inset; }
  .cell span { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .status { min-height: 1.5em; font-weight: 600; margin-bottom: 14px; }
  .score { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px;
           overflow: hidden; margin-bottom: 16px; }
  .score div { padding: 10px 4px; background: var(--panel); }
  .score div + div { border-left: 1px solid var(--line); }
  .score b { display: block; font-size: 1.3rem; }
  .score small { color: var(--muted); }
  .actions button { background: var(--text); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 18px;
                    font: inherit; font-weight: 600; cursor: pointer; }
  .actions button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-left: 6px; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .cell span { animation: none; } .cell { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Beat the Firewall</h1>
  <p class="sub">You are <strong style="color:var(--x)">X</strong>. The firewall is <strong style="color:var(--o)">O</strong>.</p>

  <div class="modes" role="group" aria-label="Difficulty">
    <button data-mode="easy" aria-pressed="false">Easy</button>
    <button data-mode="medium" aria-pressed="false">Medium</button>
    <button data-mode="hard" aria-pressed="true">Unbeatable</button>
  </div>

  <div class="status" id="status" aria-live="polite">Your move.</div>
  <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <div class="score" aria-label="Score">
    <div><b id="s-you">0</b><small>You</small></div>
    <div><b id="s-draw">0</b><small>Draws</small></div>
    <div><b id="s-fw">0</b><small>Firewall</small></div>
  </div>

  <div class="actions">
    <button id="again">New game</button>
    <button id="swap" class="ghost">Firewall starts</button>
  </div>

  <footer><a href="https://github.com/Kathan2004">github.com/Kathan2004</a></footer>
</main>
<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const cells = [];
  let board, over, mode = "hard", firewallFirst = false;
  let score = { you: 0, draw: 0, fw: 0 };

  try { score = { ...score, ...JSON.parse(localStorage.getItem("ttt-score") || "{}") }; } catch {}
  try { mode = localStorage.getItem("ttt-mode") || mode; } catch {}

  const save = () => { try { localStorage.setItem("ttt-score", JSON.stringify(score)); localStorage.setItem("ttt-mode", mode); } catch {} };

  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.setAttribute("aria-label", `Square ${i + 1}`);
    b.addEventListener("click", () => play(i));
    boardEl.appendChild(b);
    cells.push(b);
  }

  function winner(b) {
    for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { who: b[l[0]], line: l };
    return b.every(Boolean) ? { who: "draw", line: [] } : null;
  }

  function minimax(b, me, depth = 0) {
    const w = winner(b);
    if (w) return { score: w.who === "O" ? 10 - depth : w.who === "X" ? depth - 10 : 0 };
    let best = { score: me === "O" ? -Infinity : Infinity, move: -1 };
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = me;
      const r = minimax(b, me === "O" ? "X" : "O", depth + 1);
      b[i] = null;
      if ((me === "O" && r.score > best.score) || (me === "X" && r.score < best.score)) best = { score: r.score, move: i };
    }
    return best;
  }

  function firewallMove() {
    const free = board.map((v, i) => (v ? null : i)).filter((v) => v !== null);
    const random = free[Math.floor(Math.random() * free.length)];
    if (mode === "easy") return random;
    if (mode === "medium" && Math.random() < 0.35) return random;
    return minimax(board.slice(), "O").move;
  }

  function render(result) {
    board.forEach((v, i) => {
      const c = cells[i];
      c.className = "cell" + (v ? " " + v.toLowerCase() : "") + (result && result.line.includes(i) ? " win" : "");
      c.innerHTML = v ? `<span>${v}</span>` : "";
      c.disabled = Boolean(v) || over;
      c.setAttribute("aria-label", `Square ${i + 1}${v ? ", " + v : ", empty"}`);
    });
    document.getElementById("s-you").textContent = score.you;
    document.getElementById("s-draw").textContent = score.draw;
    document.getElementById("s-fw").textContent = score.fw;
    document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  }

  function finish(result) {
    over = true;
    if (result.who === "X") { score.you++; statusEl.textContent = mode === "hard" ? "You beat the firewall. That should not be possible." : "You breached the firewall."; }
    else if (result.who === "O") { score.fw++; statusEl.textContent = "Access denied. The firewall wins."; }
    else { score.draw++; statusEl.textContent = mode === "hard" ? "Draw. The best anyone can do." : "Draw."; }
    save();
    render(result);
  }

  function step() {
    const r = winner(board);
    if (r) return finish(r);
    statusEl.textContent = "Your move.";
    render(null);
  }

  function firewallTurn() {
    over = true; render(null);
    statusEl.textContent = "Firewall is thinking...";
    setTimeout(() => {
      over = false;
      board[firewallMove()] = "O";
      step();
    }, 350);
  }

  function play(i) {
    if (over || board[i]) return;
    board[i] = "X";
    const r = winner(board);
    if (r) return finish(r);
    firewallTurn();
  }

  function newGame() {
    board = Array(9).fill(null);
    over = false;
    if (firewallFirst) firewallTurn(); else step();
  }

  document.getElementById("again").addEventListener("click", newGame);
  document.getElementById("swap").addEventListener("click", (e) => {
    firewallFirst = !firewallFirst;
    e.target.textContent = firewallFirst ? "You start" : "Firewall starts";
    newGame();
  });
  document.querySelectorAll(".modes button").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.mode; save(); newGame(); }));

  newGame();
})();
</script>
</body>
</html>
